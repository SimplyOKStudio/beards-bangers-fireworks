<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Checkout | Beard's Bangers Fireworks</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Staff Checkout</h1>
    <p>Beard's Bangers Fireworks</p>
  </header>

  <main>
    <section class="staff-checkout-panel">
  <h2 id="staff-ticket-heading">Loading order...</h2>

  <p class="staff-checkout-note">
    This page is for stand staff to review and edit a submitted customer list.
  </p>

  <!-- Staff product search and add section starts here. -->
  <div class="staff-product-tools">
    <h2>Add Products</h2>

    <input
      id="staff-product-search"
      type="text"
      placeholder="Search products to add..."
    >

    <div id="staff-category-buttons" class="staff-category-buttons">
      Loading categories...
    </div>

    <div id="staff-product-results" class="staff-product-results">
      Search or choose a category to add more products.
    </div>
  </div>
  <!-- Staff product search and add section ends here. -->

  <h2 class="staff-current-order-heading">Current Order</h2>

  <div id="staff-order-list">
    Loading selected fireworks...
  </div>
  </main>

    <script src="catalog.js?v=3"></script>
    <script src="staff-checkout.js?v=3"></script>
</body>
</html>
