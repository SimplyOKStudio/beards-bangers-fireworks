<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Checkout | Beard's Bangers Fireworks</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Staff Checkout</h1>
    <p>Beard's Bangers Fireworks</p>
  </header>

  <main>
    <section class="staff-checkout-panel">
      <h2 id="staff-ticket-heading">Loading order...</h2>

      <p class="staff-checkout-note">
        This page is for stand staff to review and edit a submitted customer list.
      </p>

      <div id="staff-order-list">
        Loading selected fireworks...
      </div>

      <div class="staff-total-box">
        <p id="staff-subtotal-text">Subtotal: $0.00</p>
        <p id="staff-tax-text">Estimated Tax: $0.00</p>
        <p id="staff-total-text">Estimated Total: $0.00</p>
      </div>
    </section>
  </main>

  <script src="catalog.js"></script>
  <script src="staff-checkout.js"></script>
</body>
</html>
