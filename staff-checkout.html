<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Checkout | Beard's Bangers Fireworks</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Staff Checkout</h1>
    <p>Beard's Bangers Fireworks</p>
  </header>

  <main>
    <section class="staff-shop-panel">
      <h2 id="staff-ticket-heading">Loading order...</h2>

      <p class="staff-checkout-note">
        Staff tool: review, edit, and add items to a submitted customer list.
      </p>

      <div id="staff-sticky-shop-bar">
        <input
          id="staff-product-search"
          type="text"
          placeholder="Search fireworks..."
        >

        <button id="staff-floating-list-button" type="button" onclick="scrollToStaffOrder()">
          <span id="staff-floating-list-label">My List</span>
          <span id="staff-floating-list-count">0 items</span>
          <span id="staff-floating-list-total">$0.00</span>
        </button>
      </div>

      <div id="staff-category-buttons" class="staff-category-buttons">
        Loading categories...
      </div>

      <div id="staff-product-results" class="staff-product-results">
        Loading products...
      </div>

      <h2 id="staff-current-order-heading">Current Order</h2>

      <div id="staff-order-list">
        Loading selected fireworks...
      </div>

      <div class="staff-total-box">
        <p id="staff-subtotal-text">Subtotal: $0.00</p>
        <p id="staff-tax-text">Estimated Tax: $0.00</p>
        <p id="staff-total-text">Estimated Total: $0.00</p>
      </div>
    </section>
  </main>

    <script src="catalog.js?v=6"></script>
    <script src="staff-checkout.js?v=6"></script>
</body>
</html>
